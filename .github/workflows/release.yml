# Publish a reviewed vX.Y.Z tag only after Official compatibility has passed
# for its exact commit against every official Domain and Extension.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  guard:
    name: This commit may be released
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ready.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Require main and the upgrade notes
        id: ready
        run: python3 scripts/release.py ready

  compatibility:
    name: Official compatibility at the latest releases
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/domains.yml
    with:
      domains_at: latest-release
      platform_version: ${{ needs.guard.outputs.version }}

  publish:
    name: Publish the release
    needs: [guard, compatibility]
    if: needs.compatibility.outputs.compatible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: catalogue
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
      - name: Collect the tested sets
        uses: actions/download-artifact@v7
        with:
          pattern: tested-*
          path: sets
      - name: Record the tested sets and list the release
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          records=$(find sets -name tested-set.json | sort)
          for attempt in 1 2 3; do
            rm -rf published
            if git clone --quiet --branch catalogue --single-branch --depth 1 "$remote" published 2>/dev/null; then
              :
            else
              git init --quiet --initial-branch catalogue published
            fi
            # shellcheck disable=SC2086
            python3 scripts/catalogue.py publish --from catalogue.json --into published/catalogue.json --record $records
            python3 scripts/catalogue.py refresh --from catalogue.json --into published/catalogue.json --platform-version "$PLATFORM_VERSION"
            git -C published add catalogue.json
            git -C published -c user.name=github-actions -c user.email=github-actions@github.com \
              commit --quiet --allow-empty -m "Publish Bilibi v$PLATFORM_VERSION ($GITHUB_RUN_ID)"
            if git -C published push --quiet "$remote" HEAD:refs/heads/catalogue; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt; another catalogue run wrote first, retrying"
          done
          exit 1
