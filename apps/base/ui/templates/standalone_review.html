<div id="app"{% if live %} data-live{% endif %}>
<div id="app-shell" data-hook="FramedDisplay" data-framed="false" data-csrf="{{ csrf }}" data-impersonating="{{ impersonating }}" data-tenant-id="{{ tenant_id }}" data-user-id="{{ user_id }}" data-company-id="{% if let Some(id) = company_id %}{{ id }}{% endif %}" data-theme-choice="{{ preferences.theme }}" data-display-mode="{{ preferences.mode }}" class="min-h-svh bg-canvas">
<main id="app-content" class="flex min-h-svh flex-col items-center justify-center gap-6 p-6">
<div class="flex w-full max-w-2xl flex-col gap-5">
<a href="/" class="flex flex-col items-center gap-2.5" aria-label="Bilibi home"><img src="{{ bilibi_ui::Assets::url("/favicon.svg") }}" alt="" class="size-9 shrink-0 object-contain" width="36" height="36" decoding="async" loading="eager" aria-hidden="true"><span class="text-base font-semibold tracking-tight text-ink-strong">Bilibi</span></a>
<div class="flex justify-center">{{ instance|safe }}</div>
<div id="standalone-review-card" class="rounded-xl border border-line bg-surface shadow-sm shadow-ink/[0.04]"><div class="h-0.5 rounded-t-xl bg-brand" aria-hidden="true"></div><div class="px-5 py-5 sm:px-7">{{ body|safe }}</div></div>
<p class="text-center text-xs text-ink-faint">Business application platform</p>
</div>
</main>
</div>
</div>
