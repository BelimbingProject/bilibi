<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-1 max-h-48 overflow-y-auto" id="available-capabilities-list">{% for cap in options %}<label id="available-cap-label-{{ cap.dom_id }}" class="flex items-center gap-2 px-2 py-1 rounded text-sm hover:bg-surface-sunken cursor-pointer text-ink">{% if include_visible_keys %}<input type="hidden" name="visible_capability_keys[]" value="{{ cap.key }}" />{% endif %}<input type="checkbox" name="capability_keys[]" value="{{ cap.key }}"{% if cap.checked %} checked{% endif %} class="rounded border-high-contrast-line accent-action focus:ring-brand-strong/30" /><span class="truncate" title="{{ cap.key }}">{{ cap.key }}</span></label>{% endfor %}</div>
