{#- A whole error document: the stylesheet and nothing else. `body` is the credential layout. -#}
<!doctype html>
<html lang="en"{% if let Some(brand) = brand %}{% if !brand.accent_attr().is_empty() %} data-accent="{{ brand.accent_attr() }}"{% endif %}{% endif %} class="h-full bg-canvas"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title>{% if let Some(brand) = brand %}{% if let Some(logo) = brand.logo %}<link rel="icon" href="{{ logo }}">{% else %}<link rel="icon" href="{{ bilibi_ui::Assets::url("/favicon.svg") }}" type="image/svg+xml">{% endif %}{% endif %}<link rel="stylesheet" href="{{ bilibi_ui::Assets::url("/assets/app.css") }}"></head><body class="h-full bg-canvas text-ink antialiased">{{ body }}</body></html>
